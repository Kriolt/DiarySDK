[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "diarysdk"
dynamic = ["version"]
description = "SDK дневника «Моя школа»: данные ученика по его токену, клиент и сервис"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.14.3",
    # База часовых поясов для Europe/Moscow: в slim-образе и на Windows
    # системной может не быть.
    "tzdata==2026.6",
]

[project.optional-dependencies]
server = [
    "fastapi==0.162.7",
    "uvicorn==0.54.0",
]
# Тесты и линтер. Отдельно от сборки: twine тянет cryptography/cffi, которые
# на пре-релизе Python ещё не собираются (CI, задача test-next).
test = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
]
dev = [
    "diarysdk[test]",
    "build==1.6.1",
    "twine==7.0.0",
]

[tool.hatch.version]
path = "diarysdk/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["diarysdk"]

# В sdist — только код, тесты, примеры, скрипты и публичные документы:
# внутренние заметки, окружение и кэши туда не попадают.
[tool.hatch.build.targets.sdist]
include = [
    "/diarysdk",
    "/tests",
    "/examples",
    "/scripts",
    "/docs/reference.md",
    "/docs/architecture.md",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = ["__pycache__", "*.py[cod]"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.format]
# Заглушку собирает scripts/gen_sync_stub.py: её вид задаёт генератор.
exclude = ["diarysdk/sync.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "DTZ", "RUF"]
# Кириллица в строках и комментариях — норма для проекта, а не «похожие символы».
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["diarysdk", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
"diarysdk/sync.pyi" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
